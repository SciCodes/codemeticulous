[project]
name = "codemeticulous"
version = "0.1.0"
description = "validate and convert software metadata formats with pydantic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    "instructor>=1.13.0",
    "litellm>=1.77.1",
    "pydantic-codemeta>=0.1.0,<0.2",
    "pydantic>=2.9.2,<3",
    "pyyaml>=6.0.2",
]

[project.scripts]
codemeticulous = "codemeticulous.cli:cli"

[dependency-groups]
dev = [
    "black>=24.8.0",
    "datamodel-code-generator>=0.26.2",
    "pytest>=8.3.3",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["codemeticulous", "codemeticulous.*"]
exclude = ["tests*", "schema"]
